<!DOCTYPE html>
<html lang="fr" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>500 &mdash; Komptia</title>
    <link rel="stylesheet" href="/static/css/tailwind.min.css">
    <script>
        (function() {
            try {
                // ADV-8 (2026-05-26) : cf. note dans login.html — la clé
                // legacy est purgée par base.html. On lit la clé anon
                // (l'utilisateur peut être authentifié mais l'erreur 500
                // peut survenir avant le bootstrap user-id, donc anon est
                // le seul commun dénominateur safe ici).
                var m = localStorage.getItem('komptia_theme_uanon')
                    || localStorage.getItem('komptia_theme');
                if (m !== 'light' && m !== 'dark' && m !== 'system') m = 'system';
                var dark = m === 'dark' || (m === 'system' &&
                    window.matchMedia &&
                    window.matchMedia('(prefers-color-scheme: dark)').matches);
                document.documentElement.classList.toggle('dark', !!dark);
            } catch(e) {}
        })();
    </script>
</head>
<body class="h-full bg-gray-50 antialiased flex items-center justify-center dark:bg-gray-900">
    <div class="text-center px-4">
        <p class="text-6xl font-bold text-gray-300 dark:text-gray-700 mb-4">500</p>
        <h1 class="text-lg font-semibold text-gray-900 dark:text-gray-100 mb-2">Erreur interne</h1>
        <p class="text-sm text-gray-700 dark:text-gray-300 mb-6">Une erreur inattendue s'est produite. Veuillez r&eacute;essayer.</p>
        <a href="/" class="inline-block px-4 py-2 bg-gray-900 text-white text-sm font-medium rounded hover:bg-gray-800 dark:bg-gray-100 dark:text-gray-900 dark:hover:bg-white no-underline">Retour &agrave; l'accueil</a>
    </div>
</body>
</html>
