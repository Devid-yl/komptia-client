<!DOCTYPE html>
<html lang="fr" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Erreur {{ status }} | {{ app_name }}</title>
    <meta name="robots" content="noindex, nofollow">
    <link rel="stylesheet" href="/static/css/tailwind.min.css">
    <link rel="stylesheet" href="/static/css/feedback-reporter.css">
    <script nonce="{{ handler.csp_nonce }}">
        // Cohérent avec login.html / base.html : suit prefers-color-scheme
        // par défaut. L'utilisateur peut forcer light ou dark dans /settings.
        // ADV-S23 : fallback sur prefers-color-scheme dans le ``catch``
        // pour les cas où ``localStorage`` lève (Safari privé, iframe
        // sandbox, navigateur durci). Sans ce fallback, page reste light
        // alors que l'OS est en dark → flash blanc agressif.
        (function() {
            function applyDark(dark) {
                try { document.documentElement.classList.toggle('dark', !!dark); } catch (_) {}
            }
            function osDark() {
                try {
                    return !!(window.matchMedia &&
                              window.matchMedia('(prefers-color-scheme: dark)').matches);
                } catch (_) { return false; }
            }
            try {
                // ADV-9 (2026-05-26) : la clé legacy ``komptia_theme`` est
                // SUPPRIMÉE activement par base.html (S-2 cleanup cross-user
                // leak). Sur error.html, l'utilisateur peut être authentifié
                // OU anonyme — on ne sait pas si on est avant ou après le
                // bootstrap base.html. On lit la clé scopée anon (toujours
                // safe, cohérente avec base.html qui écrit
                // ``komptia_theme_u`` + userId() où userId() peut être 'anon').
                // Fallback transitoire ``|| komptia_theme`` pour les
                // navigateurs avec ancienne clé en cache (read-only).
                var m = localStorage.getItem('komptia_theme_uanon')
                    || localStorage.getItem('komptia_theme');
                if (m === 'light')      applyDark(false);
                else if (m === 'dark')  applyDark(true);
                else                    applyDark(osDark());
            } catch (e) {
                // localStorage indisponible → fallback OS au lieu de rester
                // bloqué en light (flash blanc dérangeant si OS=dark).
                applyDark(osDark());
            }
        })();
    </script>
</head>
<body class="h-full bg-gray-50 antialiased flex items-center justify-center dark:bg-gray-900">
    <div class="text-center px-4">
        <p class="text-6xl font-bold text-gray-300 dark:text-gray-700 mb-4">{{ status }}</p>
        <p class="text-sm text-gray-700 dark:text-gray-300 mb-6">{{ message }}</p>
        <div class="flex flex-col sm:flex-row items-center justify-center gap-3">
            <a href="/" class="inline-block px-4 py-2 bg-gray-900 text-white text-sm font-medium rounded hover:bg-gray-800 dark:bg-gray-100 dark:text-gray-900 dark:hover:bg-white no-underline">Retour à l'accueil</a>
            {# ADV-C9 : page d'erreur = moment où l'utilisateur a le PLUS
               besoin de pouvoir signaler. On charge feedback-reporter et
               on expose un bouton qui pré-remplit avec le contexte. #}
            <button type="button" id="error-report-btn"
                    class="inline-block px-4 py-2 border border-gray-300 dark:border-gray-700 text-gray-700 dark:text-gray-200 text-sm font-medium rounded hover:bg-gray-100 dark:hover:bg-gray-800">
                Signaler ce problème
            </button>
        </div>
        <p class="mt-6 text-xs text-gray-400 dark:text-gray-600">Référence : {{ request_id }}</p>
    </div>

    <script src="/static/js/feedback-reporter.js" nonce="{{ handler.csp_nonce }}"></script>
    <script nonce="{{ handler.csp_nonce }}">
        (function() {
            var btn = document.getElementById('error-report-btn');
            if (!btn) return;
            btn.addEventListener('click', function() {
                if (typeof window.komptiaReportFeedback !== 'function') {
                    window.alert('Le module de signalement n\'est pas disponible. Rechargez la page puis réessayez.');
                    return;
                }
                var ctx = 'Erreur {{ status }} sur ' + window.location.pathname
                    + (window.location.search || '')
                    + ' (référence : {{ request_id }})\n\nDescription du problème : ';
                window.komptiaReportFeedback({ message: ctx });
            });
        })();
    </script>
</body>
</html>
