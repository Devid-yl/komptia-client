# Nginx — reverse-proxy HTTPS pour Komptia (container Docker sur 127.0.0.1:8888)
#
# Adapter `server_name` ci-dessous (komptia.exemple.fr) au domaine réel,
# puis générer les certificats Let's Encrypt :
#   sudo certbot --nginx -d <votre-domaine>
#
# Les directives `limit_req_zone` doivent être dans le bloc http{} de
# /etc/nginx/nginx.conf (PAS dans server{}). Ajouter dans nginx.conf :
#
#   limit_req_zone $binary_remote_addr zone=komptia_limit:10m rate=10r/s;
#   limit_req_zone $binary_remote_addr zone=login_limit:10m rate=5r/m;
#
# Activer ce site :
#   sudo ln -s /etc/nginx/sites-available/komptia /etc/nginx/sites-enabled/

# Redirect HTTP to HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name komptia.exemple.fr;

    # Let's Encrypt ACME challenge
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Redirect all HTTP requests to HTTPS
    # Note: $server_name (pas $host) pour éviter les redirections injectées
    # via Host header malveillant (cache poisoning sur proxies intermédiaires)
    location / {
        return 301 https://$server_name$request_uri;
    }
}

# HTTPS Server
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name komptia.exemple.fr;

    # SSL Configuration
    ssl_certificate /etc/letsencrypt/live/komptia.exemple.fr/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/komptia.exemple.fr/privkey.pem;
    ssl_trusted_certificate /etc/letsencrypt/live/komptia.exemple.fr/chain.pem;

    # SSL Security Best Practices
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384';
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;
    ssl_session_tickets off;

    # OCSP Stapling
    ssl_stapling on;
    ssl_stapling_verify on;
    resolver 8.8.8.8 8.8.4.4 valid=300s;
    resolver_timeout 5s;

    # Security Headers (additional to app middleware)
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Logging
    access_log /var/log/nginx/komptia_access.log combined;
    error_log /var/log/nginx/komptia_error.log warn;

    # Client body size limit (prevent large uploads).
    #
    # ⚠️ COUPLAGE OBLIGATOIRE avec le cap applicatif `MAX_UPLOAD_SIZE_BYTES`
    # (admin /admin/performance, défaut 50 Mio = 52 428 800 o, lu par
    # app/services/ai/config_service.get_max_upload_size_bytes).
    # nginx est DEVANT l'app : si `client_max_body_size` < le cap app, nginx
    # rejette en HTML 413 AVANT Tornado et le réglage admin est SILENCIEUSEMENT
    # ignoré (cap inversion). Garder cette valeur >= cap app + marge multipart.
    # 64M couvre 50 Mio + l'overhead form-data. Si l'admin monte le cap app
    # au-delà, monter AUSSI cette ligne (et redéployer nginx).
    #
    # Les gros classeurs .afz.json sont gzippés CÔTÉ NAVIGATEUR avant l'envoi
    # (static/js/iris-grid.js:_gzipStringToBlob → ~20× plus petit sur le fil,
    # le serveur décompresse via les magic bytes), donc le payload réseau ≈
    # la taille disque compressée : 64M est très confortable pour le cas réel.
    client_max_body_size 64M;
    client_body_timeout 60s;
    client_header_timeout 60s;

    # Réponses d'erreur générées par nginx LUI-MÊME (413 oversize, 429
    # rate-limit, 502/503/504 passerelle) → renvoyées en JSON (et non en HTML)
    # pour que le client les lise avec le même code que les erreurs
    # applicatives (Tornado renvoie déjà du JSON via write_error). Défense en
    # profondeur AVEC le helper client window.komptiaReadJson : même un site JS
    # non migré dégrade en objet propre au lieu de "SyntaxError: Unexpected
    # token <".
    #
    # ⚠️ Une location PAR code, et chacune ``return <le_même_code>`` : ça
    # PRÉSERVE le status exact (413/429/502/503/504) tout en renvoyant le JSON.
    # Surtout NE PAS faire ``error_page ... @loc`` + ``return 200`` — ça
    # transformerait un 413 en 200 que le client lirait comme un SUCCÈS (donnée
    # fausse silencieuse). On NE collapse PAS 502/503/504 en un seul code : un
    # 504 (timeout IA long, proxy_read_timeout 300s) doit rester un 504 — le
    # helper client a un message distinct, et un monitoring/retry peut s'y fier
    # (re-router un POST non-idempotent sur un faux "503 réessayez" = risque de
    # double-exécution). ``recursive_error_pages`` est off par défaut → pas de
    # boucle. ⚠️ Limite connue acceptée : ces réponses JSON s'appliquent AUSSI
    # aux navigations pleine-page (pas seulement aux fetch) — un user qui tombe
    # sur un 502/504 en navigation directe verra du JSON brut au lieu d'une
    # page HTML d'erreur. Compromis assumé pour une app très fetch-centrée ;
    # le vrai correctif du crash est le helper client, ceci est en défense.
    error_page 413 /__komptia_err_413.json;
    error_page 429 /__komptia_err_429.json;
    error_page 502 /__komptia_err_502.json;
    error_page 503 /__komptia_err_503.json;
    error_page 504 /__komptia_err_504.json;
    location = /__komptia_err_413.json {
        internal;
        default_type application/json;
        return 413 '{"success":false,"error":"Données trop volumineuses pour le serveur.","gateway_error":true}';
    }
    location = /__komptia_err_429.json {
        internal;
        default_type application/json;
        return 429 '{"success":false,"error":"Trop de requêtes. Patientez quelques secondes.","gateway_error":true}';
    }
    location = /__komptia_err_502.json {
        internal;
        default_type application/json;
        return 502 '{"success":false,"error":"Serveur momentanément indisponible. Réessayez.","gateway_error":true}';
    }
    location = /__komptia_err_503.json {
        internal;
        default_type application/json;
        return 503 '{"success":false,"error":"Serveur momentanément indisponible. Réessayez.","gateway_error":true}';
    }
    location = /__komptia_err_504.json {
        internal;
        default_type application/json;
        return 504 '{"success":false,"error":"Le serveur a mis trop de temps à répondre.","gateway_error":true}';
    }

    # Gzip Compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml text/javascript application/json application/javascript application/xml+rss application/rss+xml font/truetype font/opentype application/vnd.ms-fontobject image/svg+xml;
    gzip_disable "msie6";

    # Rate Limiting (zones defined in http{} block of nginx.conf).
    # PAS de limit_req au niveau server : sinon /static/ (40+ assets par page)
    # est throttlé → le navigateur reçoit des 429 sur les JS/CSS et le dashboard
    # se charge cassé. La limite générale est posée UNIQUEMENT sur le proxy
    # applicatif (location /) avec un burst large ; les assets statiques ne sont
    # jamais limités, et = /login conserve son anti-brute-force dédié.
    limit_req_status 429;

    # Static Files — servis par Tornado dans le container Docker
    # (les fichiers ne sont pas sur l'host, on proxy avec un cache navigateur)
    location /static/ {
        proxy_pass http://127.0.0.1:8888;
        proxy_set_header Host $host;
        expires 7d;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # Favicon — idem, servi par le container
    location = /favicon.ico {
        proxy_pass http://127.0.0.1:8888;
        proxy_set_header Host $host;
        expires 30d;
        access_log off;
    }

    # Health Check Endpoint
    location /health {
        proxy_pass http://127.0.0.1:8888/health;
        access_log off;
    }

    # Stricter rate limit for login endpoint.
    # NB : la route réelle est ``/login`` (cf. app/routes.py — LoginHandler),
    # PAS ``/api/auth/login`` (qui n'existe pas → l'ancienne location ne
    # matchait jamais, rate-limit login mort). ``= /login`` (match exact)
    # couvre GET (page) + POST (soumission). Défense-en-profondeur : l'app
    # applique en plus son propre limiter per-IP+email (config.security.
    # rate_limit_login).
    location = /login {
        limit_req zone=login_limit burst=3 nodelay;
        proxy_pass http://127.0.0.1:8888;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Websocket Support (for Komptia real-time chat)
    location /ws {
        proxy_pass http://127.0.0.1:8888;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400;
    }

    # Main Application Proxy
    location / {
        # Rate-limit généreux posé UNIQUEMENT ici (ni /static/ ni /health) :
        # absorbe le burst d'appels API d'un chargement de page sans 429.
        limit_req zone=komptia_limit burst=50 nodelay;
        proxy_pass http://127.0.0.1:8888;
        proxy_http_version 1.1;

        # ⚠️ Garde EXPLICITE : ne PAS intercepter les erreurs upstream. Tornado
        # renvoie déjà du JSON (write_error) pour ses 4xx/5xx, y compris le 413
        # quota avec ``error_code: QUOTA_EXCEEDED``. ``proxy_intercept_errors off``
        # (défaut) garantit que ces corps JSON applicatifs passent INTACTS — les
        # ``error_page`` ci-dessus ne s'appliquent qu'aux erreurs générées par
        # nginx lui-même (413 oversize, 429, 502/504 upstream injoignable).
        # Explicite pour qu'un futur dev ne l'active pas par mégarde (sinon il
        # écraserait QUOTA_EXCEEDED → casse la désambiguïsation quota/oversize).
        proxy_intercept_errors off;

        # Proxy Headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;

        # Timeouts
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        #
        # ⚠️ COUPLAGE OBLIGATOIRE avec le budget temps du run copilot
        # (``KOMPTIA_COPILOT_RUN_BUDGET_S``, défaut 270s — cf.
        # app/services/ai/copilot_agent.py). Le POST /api/iris/result-modify
        # est un LONG-POLL qui dure tout le run de l'agent : si ce
        # proxy_read_timeout est INFÉRIEUR au budget serveur, nginx coupe en
        # 504 avant la fin propre et le travail du run est perdu. Garder
        # proxy_read_timeout > budget + marge (30s ici). Si vous montez le
        # budget, montez AUSSI cette ligne (et inversement).
        proxy_read_timeout 300s;  # 5 minutes for long IA queries

        # Buffering
        proxy_buffering on;
        proxy_buffer_size 4k;
        proxy_buffers 8 4k;
        proxy_busy_buffers_size 8k;

        # Error handling — only retry on network errors, not HTTP errors
        # (retrying 500s on a single upstream can cause double-execution)
        proxy_next_upstream error timeout;
        proxy_next_upstream_tries 2;
    }

    # Block known malicious bots (allow curl/wget for health checks and API clients)
    if ($http_user_agent ~* (bot|spider|crawler|scraper)) {
        return 403;
    }

    # Deny access to hidden files
    location ~ /\. {
        deny all;
        access_log off;
    }

    # Deny access to backup files
    location ~ ~$ {
        deny all;
        access_log off;
    }
}
